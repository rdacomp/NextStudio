name: Temporary U200B Android APK Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-u200b-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 and Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: chatgpt-build/u200b
        run: gradle --no-daemon :app:assembleRelease

      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/u200b-release.jks \
            -storepass U200BBuild2026 \
            -keypass U200BBuild2026 \
            -alias u200b \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=U200B Text Matrix,O=U200B Build,C=US"

      - name: Align, sign and verify
        working-directory: chatgpt-build/u200b
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/U200B_TextMatrix_3.3_aligned.apk"
          FINAL="app/build/outputs/apk/release/U200B_TextMatrix_Android_3.3_INSTALL.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign \
            --ks /tmp/u200b-release.jks \
            --ks-key-alias u200b \
            --ks-pass pass:U200BBuild2026 \
            --key-pass pass:U200BBuild2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$FINAL" | tee app/build/outputs/apk/release/zipalign-report.txt
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee app/build/outputs/apk/release/signature-report.txt
          sha256sum "$FINAL" | tee app/build/outputs/apk/release/SHA256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: U200B-TextMatrix-Android-3.3
          path: |
            chatgpt-build/u200b/app/build/outputs/apk/release/U200B_TextMatrix_Android_3.3_INSTALL.apk
            chatgpt-build/u200b/app/build/outputs/apk/release/signature-report.txt
            chatgpt-build/u200b/app/build/outputs/apk/release/zipalign-report.txt
            chatgpt-build/u200b/app/build/outputs/apk/release/SHA256.txt
          if-no-files-found: error
          retention-days: 1
