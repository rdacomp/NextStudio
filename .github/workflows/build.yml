name: Temporary U200B Android 3.4 Unsigned Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-u200b-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 and Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: chatgpt-build/u200b
        run: gradle --no-daemon :app:assembleRelease

      - name: Zipalign unsigned APK and export signer tool
        working-directory: chatgpt-build/u200b
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/U200B_TextMatrix_Android_3.4_ALIGNED_UNSIGNED.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED" | tee app/build/outputs/apk/release/zipalign-report.txt
          sha256sum "$ALIGNED" | tee app/build/outputs/apk/release/SHA256_UNSIGNED.txt
          cp "$BT/lib/apksigner.jar" app/build/outputs/apk/release/apksigner.jar

      - name: Upload aligned unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: U200B-TextMatrix-Android-3.4-unsigned
          path: |
            chatgpt-build/u200b/app/build/outputs/apk/release/U200B_TextMatrix_Android_3.4_ALIGNED_UNSIGNED.apk
            chatgpt-build/u200b/app/build/outputs/apk/release/zipalign-report.txt
            chatgpt-build/u200b/app/build/outputs/apk/release/SHA256_UNSIGNED.txt
            chatgpt-build/u200b/app/build/outputs/apk/release/apksigner.jar
          if-no-files-found: error
          retention-days: 1
